<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrepDex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="hero">
      <div class="hero-copy">
        <p class="eyebrow">PrepDex</p>
        <h1>Dreamy matchup prep.</h1>
        <p class="tagline">Open your new home room, then launch the match builder from there.</p>
      </div>
      <img class="mascot" src="../icons/spr_bw_518_scaled_2x_pngcrushed.png" alt="Musharna mascot">
    </div>
    <div class="actions">
      <button id="open-prepdex" class="popup-btn primary" type="button">
        <span class="btn-title">Open PrepDex Home</span>
      </button>
      <button id="clear-prepdex" class="popup-btn secondary" type="button">
        <span class="btn-title">Clear Saved Teams</span>
      </button>
    </div>
    <p id="popup-status" class="status"></p>
    <p class="credit">Developed by Rasche</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
